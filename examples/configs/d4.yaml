# D4 quiver: 0 -> 1, 1 -> 2, 1 -> 3

name: d4
type: Dn

quiver:
  name: D4
  vertices: [0, 1, 2, 3]
  arrows:
    - [0, 1, a01]
    - [1, 2, a12]
    - [1, 3, a13]

coverage:
  projective: 1
  injective: 1

runtime:
  output_dir: ./results
  workers: 32
  hilbert_workers: 32
  r_max: 3
  gc_heap_size: 16G
  hom_prime: 107
