# D4 star quiver: 0 -> 1, 2 -> 1, 1 -> 3
# This is a type D quiver with vertex 1 as the central "fork" vertex.

name: d4_star_analysis

quiver:
  name: D4_star
  vertices: [0, 1, 2, 3]
  arrows:
    - [0, 1, a01]
    - [2, 1, a21]
    - [1, 3, a13]

coverage:
  # Uniform multiplicity: 1 copy of each projective and injective
  projective: 1
  injective: 1

  # Alternative: per-vertex specification
  # projective: {0: 1, 1: 1, 2: 1, 3: 1}
  # injective: {0: 1, 1: 1, 2: 1, 3: 1}

runtime:
  output_dir: ./results/d4_star
  workers: 32
  hilbert_workers: 32
  r_max: 3
  gc_heap_size: 16G
  hom_prime: 107  # Prime for GF(p) in Hom computations (D_n only)
